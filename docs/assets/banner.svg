<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="SincronIA: real alarms for Google Calendar and Google Tasks. Built with Claude.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2A5E"/>
      <stop offset="0.55" stop-color="#1565C0"/>
      <stop offset="1" stop-color="#0277BD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#42A5F5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#42A5F5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>
    <!-- soft rings behind the icon -->
    <circle cx="330" cy="200" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="330" cy="200" r="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>

    <!-- app icon (same paths as the launcher, 108 viewport scaled to 220 px) -->
    <g transform="translate(220 90) scale(2.037)">
      <circle cx="54" cy="54" r="54" fill="#1565C0" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
      <path fill="#FFFFFF" fill-rule="evenodd" d="M37,35h34a6,6 0 0,1 6,6v32a6,6 0 0,1 -6,6h-34a6,6 0 0,1 -6,-6v-32a6,6 0 0,1 6,-6z M38,47v24a2,2 0 0,0 2,2h28a2,2 0 0,0 2,-2v-24z"/>
      <path fill="#FFFFFF" d="M41,29h4a1.5,1.5 0 0,1 1.5,1.5v8a1.5,1.5 0 0,1 -1.5,1.5h-4a1.5,1.5 0 0,1 -1.5,-1.5v-8a1.5,1.5 0 0,1 1.5,-1.5z M63,29h4a1.5,1.5 0 0,1 1.5,1.5v8a1.5,1.5 0 0,1 -1.5,1.5h-4a1.5,1.5 0 0,1 -1.5,-1.5v-8a1.5,1.5 0 0,1 1.5,-1.5z"/>
      <path fill="#FFFFFF" d="M54,50.5c-4.6,0 -7.5,3.4 -7.5,7.8v4.7l-2.5,3.5h20l-2.5,-3.5v-4.7c0,-4.4 -2.9,-7.8 -7.5,-7.8z M51.3,67.6a2.7,2.7 0 0,0 5.4,0z"/>
    </g>

    <!-- name and tagline -->
    <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#FFFFFF">
      <text x="530" y="188" font-size="92" font-weight="800" letter-spacing="-1">Sincron<tspan fill="#90CAF9">IA</tspan></text>
      <text x="534" y="240" font-size="30" font-weight="500" fill-opacity="0.92">Real alarms for Google Calendar &amp; Google Tasks</text>
      <g font-size="20" font-weight="600">
        <rect x="534" y="272" width="112" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.14"/>
        <text x="590" y="297" text-anchor="middle">Android</text>
        <rect x="658" y="272" width="196" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.14"/>
        <text x="756" y="297" text-anchor="middle">Jetpack Compose</text>
        <rect x="866" y="272" width="148" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.14"/>
        <text x="940" y="297" text-anchor="middle">Offline first</text>
        <rect x="1026" y="272" width="150" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.14"/>
        <text x="1101" y="297" text-anchor="middle">Open source</text>
      </g>
    </g>

    <!-- corner ribbon: Built with Claude -->
    <g transform="rotate(-45 0 0)">
      <rect x="-180" y="100" width="360" height="44" fill="#D97757"/>
      <rect x="-180" y="100" width="360" height="2" fill="#FFFFFF" fill-opacity="0.35"/>
      <rect x="-180" y="142" width="360" height="2" fill="#000000" fill-opacity="0.15"/>
      <!-- spark mark -->
      <g transform="translate(-86 122)" fill="#FFFFFF">
        <path d="M0,-11 L2.2,-2.2 L11,0 L2.2,2.2 L0,11 L-2.2,2.2 L-11,0 L-2.2,-2.2z"/>
        <path d="M0,-8 L1.4,-1.4 L8,0 L1.4,1.4 L0,8 L-1.4,1.4 L-8,0 L-1.4,-1.4z" transform="rotate(45)"/>
      </g>
      <text x="14" y="128" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Built with Claude</text>
    </g>
  </g>
</svg>
